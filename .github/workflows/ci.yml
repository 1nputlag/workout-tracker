name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # 1. Серверна частина: міграції, типи, модульні та інтеграційні тести на PostgreSQL, пороги покриття
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Інтеграційні тести працюють зі справжньою PostgreSQL (INF-01)
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: workout_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/workout_test
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/workout_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci                       # postinstall: prisma generate
      - name: Застосувати міграції
        run: npm run db:deploy
      - name: Перевірити, що міграції відповідають schema.prisma
        run: npm run db:check
      - run: npm run typecheck
      - run: npm run test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 14

  # 2. Клієнтська частина: перевірка типів і збірка
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  # 3. Наскрізні тести. Вимкнені, доки не реалізовано інтерфейс:
  #    Settings → Secrets and variables → Actions → Variables → додайте E2E_ENABLED = true
  e2e:
    needs: [server, client]
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-secret
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Підняти застосунок
        run: docker compose up -d --build --wait
      - name: Встановити Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Запустити e2e-тести
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:8080
          CI: 'true'
      - name: Журнали контейнерів (за невдачі)
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            compose.log
          retention-days: 14
      - if: always()
        run: docker compose down -v

  # 4. Публікація образів у GitHub Container Registry — лише для тегів вигляду v1.0.0
  publish:
    needs: [server, client, e2e]
    # e2e може бути пропущено (поки вимкнено), але не провалено
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
