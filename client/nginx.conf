server {
  listen 80;
  listen [::]:80;
  root /usr/share/nginx/html;
  index index.html;

  # Запити до API проксюються на контейнер server
  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Односторінковий застосунок: усі інші адреси віддають index.html
  location / {
    try_files $uri /index.html;
  }
}
